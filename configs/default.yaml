project:
  name: Agentic-Research
  version: 0.3.0

research:
  domain: "AI/ML research"
  focus:
    - reasoning
    - retrieval
    - RAG
    - memory
    - long-context
    - efficiency
    - evaluation
    - tool-use

safety:
  novelty_requires_external_verification: true
  require_evidence_for_claims: true
  require_sandbox_for_generated_code: true
  temporal_cutoff_enforced: true

providers:
  llm: mock
  literature:
    - openalex
    - semantic_scholar
    - arxiv
  embeddings: disabled

literature:
  request_timeout_seconds: 30
  openalex_min_interval_seconds: 0.1
  semantic_scholar_min_interval_seconds: 1.0
  arxiv_min_interval_seconds: 3.0
  fulltext_min_interval_seconds: 3.0

storage:
  mode: jsonl
