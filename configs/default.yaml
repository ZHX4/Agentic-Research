project:
  name: Agentic-Research
  version: 0.7.0

research:
  domain: "AI/ML research"
  focus:
    - reasoning
    - retrieval
    - RAG
    - memory
    - long-context
    - efficiency
    - evaluation
    - tool-use

safety:
  novelty_requires_external_verification: true
  require_evidence_for_claims: true
  require_sandbox_for_generated_code: true
  temporal_cutoff_enforced: true
  phase4_candidate_only: true
  phase5_no_global_novelty_claim: true
  phase6_no_experimental_validation_claim: true

providers:
  llm: mock
  literature:
    - openalex
    - semantic_scholar
    - arxiv
  embeddings: disabled
  reranker: lexical

literature:
  request_timeout_seconds: 30
  openalex_min_interval_seconds: 0.1
  semantic_scholar_min_interval_seconds: 1.0
  arxiv_min_interval_seconds: 3.0
  fulltext_min_interval_seconds: 3.0

retrieval:
  database: "artifacts/world-model.sqlite"
  embedding_provider: "hash"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  reranker: "lexical"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L6-v2"
  rrf_k: 60

phase4:
  min_entity_support: 2
  min_contradiction_support: 2
  min_condition_support: 1
  min_limitation_support: 2
  min_graph_degree: 2
  min_common_neighbors: 2
  max_underexplored_coverage: 0.2
  max_candidates_per_type: 200

phase5:
  external_results_per_query: 10
  local_results_per_query: 10
  max_queries_per_gap: 12
  min_direct_similarity: 0.92
  near_match_similarity: 0.72
  min_broad_searches: 3
  temporal_cutoff: null
  include_local: true
  include_external: true
  allow_status_transition: true
  deep_verify: true
  max_deep_verifications: 5
  require_deep_verification_for_supported: true
  deep_verification_similarity_floor: 0.45
  fulltext_cache_dir: "artifacts/phase5-fulltext"

phase6:
  hypotheses_per_gap: 6
  max_composed_pairs: 25
  dedup_similarity_threshold: 0.82
  tournament_size: 5
  tournament_rounds: 3
  pareto_limit: 12
  keep_diverse_limit: 20
  evolve_top_k: 6
  max_evolution_generations: 2
  min_gap_status: survived
  allow_uncertain_gaps: false
  clustering_threshold: 0.70

storage:
  mode: sqlite-world-model
