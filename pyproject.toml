[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-research"
version = "1.1.0"
description = "Evidence-grounded scientific literature intelligence and research-agent system"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ZHX4" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pymupdf>=1.28.0,<1.29",
  "typer>=0.12,<1",
  "rich>=13.7,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]
embeddings = [
  "sentence-transformers>=5.6,<6",
]
all = [
  "sentence-transformers>=5.6,<6",
]

[project.urls]
Repository = "https://github.com/ZHX4/Agentic-Research"
Issues = "https://github.com/ZHX4/Agentic-Research/issues"

[project.scripts]
agentic-research = "agentic_research.cli:app"
agentic-research-verify = "agentic_research.verification.cli:app"
agentic-research-hypotheses = "agentic_research.hypotheses.cli:app"
agentic-research-execution = "agentic_research.execution.cli:app"
agentic-research-evaluation = "agentic_research.evaluation.cli:app"
agentic-research-autonomous = "agentic_research.autonomy.cli:app"
agentic-research-publication = "agentic_research.publication.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_research"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
